<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Closed for the season</title>
  <desc id="desc">Edmonton Springs Golf Course is closed for the season. The last day of the 2026 season was Wednesday, October 21, 2026. We will see you again in spring 2027. Call the Pro Shop at (780) 962-6500 with questions.</desc>

  <rect width="800" height="1040" fill="#f6efe4"/>
  <rect width="800" height="168" fill="#8c3f1e"/>

  <text x="400" y="62" text-anchor="middle" fill="#f3d7a4" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="5">EDMONTON SPRINGS</text>
  <text x="400" y="124" text-anchor="middle" fill="#fff8ee" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700">Closed for the Season</text>

  <text x="400" y="250" text-anchor="middle" fill="#4a3424" font-family="Georgia, 'Times New Roman', serif" font-size="28">The 2026 season has ended.</text>
  <text x="400" y="294" text-anchor="middle" fill="#4a3424" font-family="Georgia, 'Times New Roman', serif" font-size="28">Thank you for golfing with us.</text>

  <rect x="48" y="348" width="704" height="168" rx="12" fill="#4d5c38"/>
  <text x="400" y="410" text-anchor="middle" fill="#f3d7a4" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="4">LAST DAY</text>
  <text x="400" y="468" text-anchor="middle" fill="#fff8ee" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Wednesday, October 21, 2026</text>

  <text x="400" y="600" text-anchor="middle" fill="#8c3f1e" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700">See you in spring 2027</text>
  <text x="400" y="648" text-anchor="middle" fill="#4a3424" font-family="Georgia, 'Times New Roman', serif" font-size="24">The course will reopen next season.</text>

  <rect x="48" y="712" width="704" height="248" rx="12" fill="#fffaf3"/>
  <text x="400" y="776" text-anchor="middle" fill="#b8431f" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="4">QUESTIONS</text>
  <text x="400" y="832" text-anchor="middle" fill="#4a3424" font-family="Georgia, 'Times New Roman', serif" font-size="28">Call the Pro Shop</text>
  <text x="400" y="892" text-anchor="middle" fill="#8c3f1e" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">(780) 962-6500</text>
</svg>
