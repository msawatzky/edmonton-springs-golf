<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1280" viewBox="0 0 800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Fall tee times and fall special</title>
  <desc id="desc">New crossover tee times start Tuesday, October 13. A foursome playing 18 with carts is $210 plus GST when all four players pay together.</desc>
  <rect width="800" height="1280" fill="#faf8f6"/>
  <rect width="800" height="196" fill="#120f11"/>
  <rect y="196" width="800" height="10" fill="#c40f39"/>

  <text x="400" y="72" text-anchor="middle" fill="#faf8f6" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6">EDMONTON SPRINGS</text>
  <text x="400" y="138" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">Fall Tee Times</text>
  <text x="400" y="176" text-anchor="middle" fill="#fbe5eb" font-family="Segoe UI, system-ui, sans-serif" font-size="20">Starting Tuesday, October 13</text>

  <text x="56" y="270" fill="#151214" font-family="Segoe UI, system-ui, sans-serif" font-size="26">
    <tspan x="56" dy="0">As the season closes, cold mornings and</tspan>
    <tspan x="56" dy="38">warm afternoons are common, so new tee</tspan>
    <tspan x="56" dy="38">time hours start Tuesday, October 13.</tspan>
  </text>

  <text x="56" y="420" fill="#120f11" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Crossover method</text>
  <text x="56" y="466" fill="#151214" font-family="Segoe UI, system-ui, sans-serif" font-size="26">We will be using the crossover method.</text>

  <rect x="48" y="500" width="704" height="168" rx="16" fill="#ffffff" stroke="#e6e3e4" stroke-width="2"/>
  <text x="72" y="556" fill="#c40f39" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">11:00 am to 1:00 pm</text>
  <text x="72" y="602" fill="#151214" font-family="Segoe UI, system-ui, sans-serif" font-size="24">Tee times run for two hours.</text>
  <text x="72" y="638" fill="#151214" font-family="Segoe UI, system-ui, sans-serif" font-size="24">Then early groups cross over.</text>

  <rect x="48" y="692" width="704" height="128" rx="16" fill="#120f11"/>
  <text x="72" y="746" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">3:15 to 4:15</text>
  <text x="72" y="788" fill="#faf8f6" font-family="Segoe UI, system-ui, sans-serif" font-size="24">Golfers can book 9 holes only.</text>

  <text x="56" y="872" fill="#3b3436" font-family="Segoe UI, system-ui, sans-serif" font-size="22">
    <tspan x="56" dy="0">This continues for the balance of the season</tspan>
    <tspan x="56" dy="34">until cold temperatures bring the season to a close.</tspan>
  </text>

  <rect x="48" y="960" width="704" height="260" rx="16" fill="#c40f39"/>
  <text x="400" y="1016" text-anchor="middle" fill="#fbe5eb" font-family="Segoe UI, system-ui, sans-serif" font-size="18" letter-spacing="4">FALL SPECIAL</text>
  <text x="400" y="1064" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="24">A foursome playing 18 with carts</text>
  <text x="400" y="1100" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="24">pays only</text>
  <text x="400" y="1168" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700">$210 + GST</text>
  <text x="400" y="1204" text-anchor="middle" fill="#fbe5eb" font-family="Segoe UI, system-ui, sans-serif" font-size="16">All 4 players must pay at the till together.</text>
</svg>
